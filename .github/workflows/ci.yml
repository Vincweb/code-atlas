name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      # The command rules are the lint, type and test steps above.
      - name: Audit code-atlas with itself
        run: node dist/cli.js --check --skip-commands
      - name: Smoke-test the built CLI on the fixture
        run: |
          STATE="$RUNNER_TEMP/atlas"
          if node dist/cli.js --root test/fixtures/layered --check --skip-commands --state "$STATE"; then
            echo "expected a non-zero exit before any baseline"
            exit 1
          fi
          node dist/cli.js --root test/fixtures/layered --update-baseline --skip-commands --state "$STATE"
          node dist/cli.js --root test/fixtures/layered --check --skip-commands --state "$STATE"
